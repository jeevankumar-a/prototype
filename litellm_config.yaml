model_list:
  - model_name: agent-router
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY
      rpm: 5
      tpm: 100000
  - model_name: agent-fallback
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      rpm: 1
      tpm: 10000
router_settings:
  num_retries: 2
  timeout: 120
  optional_pre_call_checks: ["enforce_model_rate_limits"]
  fallbacks:
    - agent-router: [agent-fallback]
# Database-backed Policies UI entries are created by scripts/provision_policies.py.
guardrails:
  - guardrail_name: document-input-policy
    litellm_params:
      guardrail: proxy_guardrails.DocumentInputPolicy
      mode: pre_call
      default_on: true
      max_input_bytes: 100000
  - guardrail_name: document-secret-guard
    litellm_params:
      guardrail: proxy_guardrails.SecretGuardrail
      mode: [pre_call, post_call]
      default_on: true
litellm_settings:
  callbacks: ["langfuse_otel", "otel"]
  drop_params: true
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
